<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Dobby </title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f7e0d6;
            font-family: 'Arial', sans-serif;
        }

        #container,
        #second-container {
            text-align: center;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #question {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
        }

        #yesButton, #no {
            font-size: 24px;
            cursor: pointer;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            color: #fff;
        }

        #yesButton {
            background-color: #4caf50;
        }

        #no {
            background-color: #f44336;
            position: absolute;
        }

        #valentine-theme {
            background: linear-gradient(to right, #f7e0d6, #f5c3bb);
        }

        #second-container {
            display: none;
            position: relative;
        }

        .gif-container {
            padding-top: 59.184%;
            position: relative;
        }

        .gif-container iframe {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #valentine-text {
            font-size: 24px;
            margin-top: 20px;
            color: #333;
        }

        #valentine-text del {
            color: #888;
        }
    </style>
</head>

<body id="valentine-theme">
    <div id="container">
        <p id="question">ስሚማ, Michael Fassbender says you are </p>
        <div class="gif-container">
            <iframe src="https://gifer.com/embed/58wK" frameBorder="0" allowFullScreen></iframe>
        </div>
        <p id="valentine-text"> Whould you be <del>my valentine</del> the metal to my Magneto?</p>
        <button id="yesButton" onclick="showSecondContainer()">Yes</button>
        <button id="no" ontouchmove="moveNo(event)" onmousemove="moveNo(event)" onclick="hideNo()">No</button>
    </div>

    <script>
        function showSecondContainer() {
            document.getElementById('container').style.display = 'none';
            document.getElementById('second-container').style.display = 'block';
        }
    </script>
</body>

</html>
